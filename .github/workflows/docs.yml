name: Docs

# The documentation site: the guides under src/GeometryHelper/docs, the README of each bridge, and an
# API reference generated from the XML comments of all four projects. DocFX has to build a project to
# read its comments, so this job compiles them the way the build workflow does. The vendor assemblies
# the bridges need are committed under Lib and Lib{year}, so nothing has to be installed. Tekla ships
# one package per version from the same source, and 2026 stands for all three: they differ in the
# assemblies they bind to, not in the API.

on:
  push:
    branches: [main]
  # Built on a pull request too, so that a link which no longer resolves is found before the change is
  # merged rather than after. Only a push to main goes on to publish.
  pull_request:
  workflow_dispatch:

# GitHub Pages needs these to accept what the job uploads.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push waits rather than cancelling the one in flight, so the
# site is never left half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Windows, like the build workflow: the geometry alone would build anywhere, but the bridges are
    # compiled here too and Windows is where they are known to compile.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.80.1

      - name: Build the site
        # docfx reads docfx.json at the root: it extracts the API metadata into docfx/api and writes the
        # site into _site. Warnings are failures here for the same reason they are in the build: a link
        # that does not resolve is a page a reader will land on and find nothing.
        run: docfx docfx.json --warningsAsErrors

      - name: Drop the source maps
        # The template ships source maps for its own JavaScript, which come to more than a third of the
        # site and are read by nothing but a browser's debugger. Nobody debugs the template, so they are
        # weight on every deployment for nothing.
        shell: pwsh
        run: Get-ChildItem _site -Recurse -Filter *.map | Remove-Item -Force

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    # A pull request is checked, never published: the site follows main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
