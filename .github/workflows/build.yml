name: GeometryHelper

# Everything except the two sample applications is built here. GeometryHelper.ArrangeAlgorithms.CadTest references AutoCAD
# assemblies that are installed on a workstation rather than vendored, and GeometryHelper.ArrangeAlgorithms.TeklaTest
# references a Tekla installation the same way, so a hosted runner cannot restore either and building the
# whole solution would fail for a reason that has nothing to do with the change under test. The Tekla
# bridge is different: the assemblies it needs are committed under src/GeometryHelper.TeklaConvert/Lib2020,
# Lib2025 and Lib2026, so it builds and tests here like anything else, once for each Tekla version it ships for.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # The test projects target net48, which needs the .NET Framework reference assemblies and test host.
    runs-on: windows-latest
    # GeometryHelper.TeklaConvert is built, tested and packed once per Tekla Structures version listed here
    # (see TeklaVersion in Directory.Build.props); each needs its Lib{year} folder next to the project.
    # Supporting another Tekla version means adding its Lib folder and its year to this list.
    env:
      TEKLA_VERSIONS: '2020 2025 2026'
    # A step that runs several commands in one pwsh script would otherwise report only the exit code of its
    # last command, because pwsh carries on past a command that fails: a test project that fails, followed by
    # one that passes, would leave the run green. Such scripts therefore begin with
    # $PSNativeCommandUseErrorActionPreference = $true (PowerShell 7.4 and later), which makes a failing command
    # an error, and the $ErrorActionPreference = 'stop' that GitHub puts in front of every pwsh script ends the
    # step on it. The shell is named here because the setting means nothing to any other shell.
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore tests/GeometryHelper.UnitTest/GeometryHelper.UnitTest.csproj
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet restore tests/GeometryHelper.TeklaConvert.UnitTest/GeometryHelper.TeklaConvert.UnitTest.csproj -p:TeklaVersion=$v
          }
          dotnet restore tests/GeometryHelper.IfcConvert.UnitTest/GeometryHelper.IfcConvert.UnitTest.csproj

      - name: Build
        # Warnings are treated as errors so that a missing XML comment or a stale cref cannot land quietly:
        # the libraries document every public member and that is worth keeping enforced.
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build tests/GeometryHelper.UnitTest/GeometryHelper.UnitTest.csproj -c Release --no-restore -warnaserror
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet build tests/GeometryHelper.TeklaConvert.UnitTest/GeometryHelper.TeklaConvert.UnitTest.csproj -c Release --no-restore -warnaserror -p:TeklaVersion=$v
          }
          dotnet build tests/GeometryHelper.IfcConvert.UnitTest/GeometryHelper.IfcConvert.UnitTest.csproj -c Release --no-restore -warnaserror

      - name: Test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test tests/GeometryHelper.UnitTest/GeometryHelper.UnitTest.csproj -c Release --no-build --verbosity normal
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet test tests/GeometryHelper.TeklaConvert.UnitTest/GeometryHelper.TeklaConvert.UnitTest.csproj -c Release --no-build --verbosity normal -p:TeklaVersion=$v
          }
          dotnet test tests/GeometryHelper.IfcConvert.UnitTest/GeometryHelper.IfcConvert.UnitTest.csproj -c Release --no-build --verbosity normal

      - name: Build libraries
        # Every packable library carries GeneratePackageOnBuild, and that switch makes `dotnet pack`
        # skip building: it expects the output to be there already. Three of the four arrive built as
        # dependencies of the test projects, but GeometryHelper.CadConvert has no test project of its own,
        # so nothing else builds it and packing it alone fails with NU5026.
        # Building all four here keeps that from depending on which library happens to be under test.
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build src/GeometryHelper/GeometryHelper.csproj -c Release -warnaserror
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet build src/GeometryHelper.TeklaConvert/GeometryHelper.TeklaConvert.csproj -c Release -warnaserror -p:TeklaVersion=$v
          }
          dotnet build src/GeometryHelper.CadConvert/GeometryHelper.CadConvert.csproj -c Release -warnaserror
          dotnet build src/GeometryHelper.IfcConvert/GeometryHelper.IfcConvert.csproj -c Release -warnaserror

      - name: Pack
        # The packages are versioned in lockstep, so they are always published as one set: one per library,
        # and one per Tekla version for GeometryHelper.TeklaConvert (GeometryHelper.TeklaConvert.2020, .2025,
        # .2026). The bridges redistribute no vendor assembly: Private=False keeps the vendor DLLs out of the
        # build output, so they cannot reach the package.
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet pack src/GeometryHelper/GeometryHelper.csproj -c Release --no-build -o artifacts
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet pack src/GeometryHelper.TeklaConvert/GeometryHelper.TeklaConvert.csproj -c Release --no-build -o artifacts -p:TeklaVersion=$v
          }
          dotnet pack src/GeometryHelper.CadConvert/GeometryHelper.CadConvert.csproj -c Release --no-build -o artifacts
          dotnet pack src/GeometryHelper.IfcConvert/GeometryHelper.IfcConvert.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.nupkg

  python:
    # The Python package geometryhelper (src/python): the stubs, the wheel, and tests/python run against the wheel
    # installed in a fresh venv, once on .NET 8 and once on .NET Framework 4.8. The job builds only what the script
    # needs, the Release libraries of GeometryHelper.Cad (with GeometryHelper and GeometryHelper.Cad.Remote) and the stub
    # generator, then runs tools/python/verify-python.sh, the same script a developer runs, so the two cannot drift
    # apart. Windows only: the wheel is tagged win_amd64. Python 3.11 and 3.14 are the two ends of what is tested.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: Build the libraries and the stub generator
        run: |
          dotnet build src/GeometryHelper.Cad/GeometryHelper.Cad.csproj -c Release -warnaserror
          dotnet build tools/GeometryHelper.PyStubs/GeometryHelper.PyStubs.csproj -c Release -warnaserror

      - name: Stubs, wheel, fresh venv and tests on both runtimes
        # find-python.sh uses GH_PYTHON when it is set, so the matrix entry is the Python that builds the wheel and
        # makes the venv that runs the tests.
        env:
          GH_PYTHON: ${{ steps.python.outputs.python-path }}
        run: bash tools/python/verify-python.sh

      - name: Build the Python host of GeometryHelper CAD and its tests
        run: dotnet build tests/GeometryHelper.Cad.Python.UnitTest/GeometryHelper.Cad.Python.UnitTest.csproj -c Release -warnaserror

      - name: Test the Python host of GeometryHelper CAD on both runtimes
        # The host starts the matrix entry's Python (the tests read GH_PYTHON, as find-python.sh does) once per test
        # process, so each target framework is a run of its own: .NET 8, then .NET Framework 4.8.
        env:
          GH_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          dotnet test tests/GeometryHelper.Cad.Python.UnitTest/GeometryHelper.Cad.Python.UnitTest.csproj -c Release --no-build -f net8.0
          dotnet test tests/GeometryHelper.Cad.Python.UnitTest/GeometryHelper.Cad.Python.UnitTest.csproj -c Release --no-build -f net48
