name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    # GeometryHelper.TeklaConvert is built, tested and packed once per Tekla Structures version listed here
    # (see TeklaVersion in Directory.Build.props); each needs its Lib{year} folder next to the project.
    # Supporting another Tekla version means adding its Lib folder and its year to this list.
    env:
      TEKLA_VERSIONS: '2020 2025 2026'
    # A step that runs several commands in one pwsh script would otherwise report only the exit code of its
    # last command, because pwsh carries on past a command that fails: a test project that fails, followed by
    # one that passes, would leave the run green. Such scripts therefore begin with
    # $PSNativeCommandUseErrorActionPreference = $true (PowerShell 7.4 and later), which makes a failing command
    # an error, and the $ErrorActionPreference = 'stop' that GitHub puts in front of every pwsh script ends the
    # step on it. The shell is named here because the setting means nothing to any other shell.
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: write
      packages: write  # Required for GitHub Packages
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore tests/GeometryHelper.UnitTest/GeometryHelper.UnitTest.csproj
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet restore tests/GeometryHelper.TeklaConvert.UnitTest/GeometryHelper.TeklaConvert.UnitTest.csproj -p:TeklaVersion=$v
          }
          dotnet restore tests/GeometryHelper.IfcConvert.UnitTest/GeometryHelper.IfcConvert.UnitTest.csproj

      - name: Build tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build tests/GeometryHelper.UnitTest/GeometryHelper.UnitTest.csproj -c Release --no-restore -warnaserror
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet build tests/GeometryHelper.TeklaConvert.UnitTest/GeometryHelper.TeklaConvert.UnitTest.csproj -c Release --no-restore -warnaserror -p:TeklaVersion=$v
          }
          dotnet build tests/GeometryHelper.IfcConvert.UnitTest/GeometryHelper.IfcConvert.UnitTest.csproj -c Release --no-restore -warnaserror

      - name: Run tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test tests/GeometryHelper.UnitTest/GeometryHelper.UnitTest.csproj -c Release --no-build --verbosity normal
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet test tests/GeometryHelper.TeklaConvert.UnitTest/GeometryHelper.TeklaConvert.UnitTest.csproj -c Release --no-build --verbosity normal -p:TeklaVersion=$v
          }
          dotnet test tests/GeometryHelper.IfcConvert.UnitTest/GeometryHelper.IfcConvert.UnitTest.csproj -c Release --no-build --verbosity normal

      - name: Build libraries
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build src/GeometryHelper/GeometryHelper.csproj -c Release -warnaserror
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet build src/GeometryHelper.TeklaConvert/GeometryHelper.TeklaConvert.csproj -c Release -warnaserror -p:TeklaVersion=$v
          }
          dotnet build src/GeometryHelper.CadConvert/GeometryHelper.CadConvert.csproj -c Release -warnaserror
          dotnet build src/GeometryHelper.IfcConvert/GeometryHelper.IfcConvert.csproj -c Release -warnaserror

      - name: Pack packages
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet pack src/GeometryHelper/GeometryHelper.csproj -c Release --no-build -o artifacts
          foreach ($v in $env:TEKLA_VERSIONS -split ' ') {
            dotnet pack src/GeometryHelper.TeklaConvert/GeometryHelper.TeklaConvert.csproj -c Release --no-build -o artifacts -p:TeklaVersion=$v
          }
          dotnet pack src/GeometryHelper.CadConvert/GeometryHelper.CadConvert.csproj -c Release --no-build -o artifacts
          dotnet pack src/GeometryHelper.IfcConvert/GeometryHelper.IfcConvert.csproj -c Release --no-build -o artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

      - name: Attach packages to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} (Get-Item artifacts/*.nupkg) --clobber

      - name: Push packages to GitHub Packages
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source "github" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          }

      - name: Authenticate with NuGet (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: nguyenthanguth

      - name: Push packages to NuGet.org
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
          }
